<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b16">
<title>Maishn.Work</title>

<style>
:root{
  color-scheme:dark;
  --bg:#070a13;
  --panel:#11172a;
  --panel2:#151d33;
  --line:#293451;
  --text:#f5f7ff;
  --muted:#9caac6;
  --blue:#6385ff;
  --cyan:#56e0ef;
  --purple:#b16bff;
  --green:#45e3a2;
  --red:#ff718b;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,#26315c70,transparent 38%),
    radial-gradient(circle at 90% 20%,#45205a55,transparent 35%),
    var(--bg);
  font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

button:disabled{
  opacity:.55;
  cursor:wait;
}

input,textarea,select{
  width:100%;
  color:var(--text);
  background:#0c1220;
  border:1px solid #303b58;
  border-radius:13px;
  padding:12px 14px;
}

textarea{
  min-height:180px;
  resize:vertical;
}

button{
  border:0;
  border-radius:13px;
  padding:11px 16px;
  font-weight:750;
  color:white;
  background:linear-gradient(110deg,#587cff,#8b5bff);
  transition:.2s;
}

button:hover{
  transform:translateY(-2px);
  filter:brightness(1.1);
}

button:active{
  transform:scale(.97);
}

.secondary{
  background:#202943;
  border:1px solid #35415e;
}

.danger{
  background:#642b3c;
}

.green{
  background:linear-gradient(110deg,#168e71,#24b991);
}

.hidden{
  display:none!important;
}

.wrap{
  width:min(1050px,100%);
  margin:auto;
  padding:20px 16px 55px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:46px;
  height:46px;
  border-radius:15px;
  display:grid;
  place-items:center;
  font-size:23px;
  background:linear-gradient(135deg,#6385ff,#a365ff);
  box-shadow:0 0 35px #7185ff35;
}

.brand-name{
  font-size:1.25rem;
  font-weight:850;
}

.brand-sub{
  display:block;
  color:var(--muted);
  font-size:.78rem;
}

.hero{
  text-align:center;
  padding:50px 0 35px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 11px;
  border:1px solid #6b83ff45;
  border-radius:99px;
  background:#637fff12;
  color:#c6d2ff;
  font-size:.76rem;
  font-weight:750;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 14px var(--green);
}

.hero h1{
  margin:20px 0 12px;
  font-size:clamp(2.7rem,8vw,5.5rem);
  line-height:1;
  letter-spacing:-.065em;
}

.gradient{
  color:transparent;
  background:linear-gradient(100deg,#fff,#9db6ff,#d3a4ff,#6be7f3);
  background-clip:text;
  -webkit-background-clip:text;
}

.hero p{
  max-width:600px;
  margin:auto;
  color:var(--muted);
}

.collection-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:16px;
}

.collection-card{
  position:relative;
  overflow:hidden;
  min-height:220px;
  padding:25px;
  text-align:left;
  border:1px solid #39476b;
  border-radius:24px;
  background:linear-gradient(145deg,#182447,#17152e);
  box-shadow:0 18px 55px #0005;
  transition:.3s;
}

.collection-card:hover{
  transform:translateY(-7px);
  border-color:#8298ff;
  box-shadow:0 25px 70px #0008;
}

.collection-card:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  right:-60px;
  top:-60px;
  border-radius:50%;
  background:#7185ff30;
  filter:blur(5px);
}

.collection-card h2{
  margin:25px 0 7px;
  font-size:1.65rem;
}

.collection-card p{
  color:var(--muted);
}

.arrow{
  display:inline-block;
  margin-top:15px;
  font-weight:800;
  color:#dce5ff;
}

.page-head{
  margin:30px 0 20px;
}

.page-head h1{
  margin:12px 0 6px;
  font-size:clamp(2rem,6vw,3.5rem);
  line-height:1.05;
}

.page-head p{
  margin:0;
  color:var(--muted);
}

.toolbar{
  display:flex;
  gap:10px;
  margin:20px 0;
}

.prompt-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}

.prompt-card{
  padding:20px;
  border:1px solid var(--line);
  border-radius:19px;
  background:linear-gradient(145deg,#151d32,#101525);
  transition:.25s;
}

.prompt-card:hover{
  transform:translateY(-4px);
  border-color:#647fff80;
}

.platform{
  display:inline-block;
  max-width:100%;
  padding:5px 10px;
  border:1px solid #4ad8e52b;
  border-radius:99px;
  color:#8fe6f1;
  background:#41d8e70c;
  font-size:.75rem;
}

.prompt-card h2{
  margin:17px 0 18px;
  font-size:1.3rem;
  line-height:1.3;
}

.copy-btn{
  width:100%;
}

.status{
  min-height:25px;
  color:#9eafd0;
  font-size:.9rem;
  margin:12px 0;
}

.empty{
  padding:30px;
  text-align:center;
  border:1px dashed #384663;
  border-radius:18px;
  color:var(--muted);
}

.footer{
  margin-top:45px;
  padding-top:20px;
  border-top:1px solid #ffffff12;
  text-align:center;
  color:var(--muted);
  font-size:.85rem;
}

.back{
  margin-bottom:15px;
}

.admin-shell{
  min-height:100vh;
  background:
    radial-gradient(circle at top right,#44276a35,transparent 35%),
    #080b14;
}

.admin-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:18px 0;
  border-bottom:1px solid #ffffff12;
}

.admin-title{
  font-weight:850;
  font-size:1.25rem;
}

.admin-layout{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:18px;
  margin-top:20px;
}

.admin-nav{
  height:max-content;
  padding:14px;
  border:1px solid #293451;
  border-radius:18px;
  background:#101625;
}

.admin-nav button{
  width:100%;
  margin-bottom:8px;
  text-align:left;
  background:#192238;
}

.admin-nav button.active{
  background:linear-gradient(110deg,#587cff,#8b5bff);
}

.admin-content{
  min-width:0;
}

.admin-box{
  padding:20px;
  border:1px solid #293451;
  border-radius:20px;
  background:linear-gradient(145deg,#121a2d,#0d1322);
  margin-bottom:16px;
}

.admin-box h2{
  margin-top:0;
}

.admin-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px 0;
  border-top:1px solid #ffffff10;
}

.admin-info{
  flex:1;
  min-width:0;
}

.admin-info strong{
  display:block;
  overflow-wrap:anywhere;
}

.admin-info small{
  display:block;
  color:var(--muted);
}

.admin-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.admin-actions button{
  padding:8px 11px;
  font-size:.8rem;
}

.login-screen{
  min-height:75vh;
  display:grid;
  place-items:center;
}

.login-box{
  width:min(470px,100%);
  padding:32px;
  text-align:center;
  border:1px solid #47557c;
  border-radius:26px;
  background:linear-gradient(145deg,#171f35,#0f1525);
  box-shadow:0 30px 100px #0008;
}

.login-icon{
  width:78px;
  height:78px;
  margin:auto auto 18px;
  display:grid;
  place-items:center;
  border-radius:25px;
  font-size:32px;
  background:linear-gradient(135deg,#6385ff,#a365ff);
  box-shadow:0 0 55px #7185ff45;
}

.form-row{
  margin:14px 0;
}

.form-row label{
  display:block;
  margin-bottom:6px;
  color:#c5cfe5;
  font-size:.85rem;
}

.modal-bg{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  place-items:center;
  padding:15px;
  background:#050712ed;
  backdrop-filter:blur(15px);
}

.modal-bg.show{
  display:grid;
}

.modal{
  width:min(620px,100%);
  max-height:92vh;
  overflow:auto;
  padding:24px;
  border:1px solid #48547a;
  border-radius:23px;
  background:#151d30;
  box-shadow:0 30px 100px #0009;
}

.modal h2{
  margin-top:0;
}

.modal-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:100;
  transform:translateX(-50%) translateY(20px);
  padding:12px 18px;
  border:1px solid #4d628e;
  border-radius:13px;
  background:#151e32;
  box-shadow:0 15px 45px #0008;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:700px){
  .admin-layout{
    grid-template-columns:1fr;
  }

  .admin-nav{
    display:flex;
    overflow:auto;
    gap:7px;
  }

  .admin-nav button{
    min-width:max-content;
    margin:0;
  }

  .admin-row{
    align-items:flex-start;
    flex-direction:column;
  }

  .admin-actions{
    width:100%;
  }

  .admin-actions button{
    flex:1;
  }

  .toolbar{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="toast" class="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
"use strict";

/* ==============================
   FIREBASE
============================== */

const firebaseConfig = {
  apiKey: "AIzaSyB6WxK_Ty-FxfG-rAScxtY8t5VjqXnoSLA",
  authDomain: "maishnwork-65719.firebaseapp.com",
  databaseURL: "https://maishnwork-65719-default-rtdb.firebaseio.com",
  projectId: "maishnwork-65719",
  storageBucket: "maishnwork-65719.firebasestorage.app",
  messagingSenderId: "472199331646",
  appId: "1:472199331646:web:f5d64df7ab68fc7cceb66f",
  measurementId: "G-HHFSBHX254"
};

const ADMIN_EMAIL = "maishn.work@gmail.com";

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let collections = [];
let prompts = [];
let selectedCollection = null;

let editingCollectionId = null;
let editingPromptId = null;

let settings = {
  brandName: "Maishn.Work",
  tagline: "Empowering your AI workflow with handcrafted prompts."
};

const app = document.getElementById("app");

function esc(value){
  return String(value ?? "");
}

function isAdmin(){
  return !!currentUser &&
    currentUser.email &&
    currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() &&
    currentUser.emailVerified === true;
}

function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },1800);
}

function orderValue(item){
  return Number(item.order || 0);
}

/* ==============================
   FIRESTORE LISTENERS
============================== */

db.collection("collections").onSnapshot(snapshot=>{
  collections = snapshot.docs
    .map(d=>({id:d.id,...d.data()}))
    .filter(x=>x.published !== false)
    .sort((a,b)=>orderValue(a)-orderValue(b));

  route();
},error=>{
  console.error(error);
});

db.collection("prompts").onSnapshot(snapshot=>{
  prompts = snapshot.docs
    .map(d=>({id:d.id,...d.data()}))
    .filter(x=>x.published !== false)
    .sort((a,b)=>orderValue(a)-orderValue(b));

  route();
},error=>{
  console.error(error);
});

db.collection("settings").doc("site").onSnapshot(doc=>{
  if(doc.exists){
    settings = {
      ...settings,
      ...doc.data()
    };
  }

  route();
});

/* ==============================
   PUBLIC HOME
============================== */

function renderHome(){

  app.innerHTML = `
    <main class="wrap">

      <header class="topbar">
        <div class="brand">
          <div class="logo">✦</div>
          <div>
            <div class="brand-name">${esc(settings.brandName)}</div>
            <span class="brand-sub">${esc(settings.tagline)}</span>
          </div>
        </div>
      </header>

      <section class="hero">
        <span class="eyebrow">
          <span class="dot"></span>
          AI PROMPT COLLECTION
        </span>

        <h1>
          Explore the
          <span class="gradient">Prompts.</span>
        </h1>

        <p>
          Discover handcrafted AI prompts for your creative workflow.
          Choose a collection and copy the prompt you need.
        </p>
      </section>

      <section class="collection-grid">

        ${
          collections.length
          ?
          collections.map((c,i)=>`
            <button
              class="collection-card"
              onclick="openCollection('${c.id}')"
            >

              <span class="eyebrow">
                ✦ COLLECTION ${i+1}
              </span>

              <h2>${esc(c.title)}</h2>

              <p>${esc(c.description || "Explore prompts from this collection.")}</p>

              <span class="arrow">
                Explore collection →
              </span>

            </button>
          `).join("")
          :
          `<div class="empty">
            No collections published yet.
          </div>`
        }

      </section>

      <footer class="footer">
        <strong>${esc(settings.brandName)}</strong>
        <br>
        ${esc(settings.tagline)}
      </footer>

    </main>
  `;
}

/* ==============================
   COLLECTION PAGE
============================== */

function openCollection(id){
  location.hash = "collection/" + encodeURIComponent(id);
}

function renderCollection(id){

  const collection =
    collections.find(x=>x.id === id);

  if(!collection){
    renderHome();
    return;
  }

  selectedCollection = collection;

  const collectionPrompts =
    prompts.filter(p=>p.collectionId === id);

  app.innerHTML = `
    <main class="wrap">

      <button class="secondary back" onclick="location.hash=''">
        ← Back
      </button>

      <section class="page-head">

        <span class="eyebrow">
          ✦ COLLECTION
        </span>

        <h1 class="gradient">
          ${esc(collection.title)}
        </h1>

        <p>
          ${esc(collection.description || "")}
        </p>

      </section>

      <div class="toolbar">

        <input
          id="promptSearch"
          type="search"
          placeholder="🔍 Search prompts..."
          oninput="filterPrompts()"
        >

      </div>

      <div id="promptGrid" class="prompt-grid">

        ${
          collectionPrompts.length
          ?
          collectionPrompts.map(p=>`

            <article
              class="prompt-card"
              data-search="${esc(
                (p.title+" "+p.platform).toLowerCase()
              )}"
            >

              <span class="platform">
                ${esc(p.platform || "AI")}
              </span>

              <h2>
                ${esc(p.title)}
              </h2>

              <button
                class="copy-btn"
                onclick="copyPrompt('${p.id}',this)"
              >
                📋 Copy Prompt
              </button>

            </article>

          `).join("")
          :
          `<div class="empty">
            No prompts in this collection yet.
          </div>`
        }

      </div>

      <footer class="footer">
        ${esc(settings.brandName)}
      </footer>

    </main>
  `;
}

function filterPrompts(){

  const query =
    document.getElementById("promptSearch")
      .value
      .toLowerCase()
      .trim();

  document
    .querySelectorAll(".prompt-card")
    .forEach(card=>{

      card.style.display =
        card.dataset.search.includes(query)
        ? ""
        : "none";

    });
}

/* ==============================
   COPY
============================== */

async function copyPrompt(id,button){

  const prompt =
    prompts.find(p=>p.id===id);

  if(!prompt) return;

  try{

    await navigator.clipboard.writeText(
      String(prompt.text || "")
    );

  }catch(error){

    const textarea =
      document.createElement("textarea");

    textarea.value =
      String(prompt.text || "");

    textarea.style.position="fixed";
    textarea.style.opacity="0";

    document.body.appendChild(textarea);
    textarea.select();

    document.execCommand("copy");

    textarea.remove();
  }

  const old = button.textContent;

  button.textContent = "✓ Copied!";

  toast("Prompt copied successfully");

  setTimeout(()=>{
    button.textContent = old;
  },1500);
}

/* ==============================
   ADMIN LOGIN
============================== */

function renderAdminLogin(){

  app.innerHTML = `
    <main class="wrap">

      <div class="login-screen">

        <section class="login-box">

          <div class="login-icon">
            ✦
          </div>

          <h1 class="gradient">
            Maishn.Work
          </h1>

          <h2>
            Admin Control Panel
          </h2>

          <p class="status">
            Private administrator access.
          </p>

          <button
            style="width:100%"
            onclick="googleLogin()"
          >
            Continue with Google
          </button>

          <p class="note">
            Authorized account only.
          </p>

        </section>

      </div>

    </main>
  `;
}

async function googleLogin(){

  try{

    const provider =
      new firebase.auth.GoogleAuthProvider();

    provider.setCustomParameters({
      prompt:"select_account"
    });

    await auth.signInWithPopup(provider);

  }catch(error){

    console.error(error);

    toast(
      error.message ||
      "Google sign-in failed"
    );
  }
}

/* ==============================
   ADMIN DASHBOARD
============================== */

function renderAdmin(){

  if(!isAdmin()){
    renderAdminLogin();
    return;
  }

  app.innerHTML = `
    <div class="admin-shell">

      <main class="wrap">

        <header class="admin-header">

          <div>
            <div class="admin-title">
              ✦ Maishn.Work
            </div>

            <small class="status">
              Admin Control Panel
            </small>
          </div>

          <button
            class="secondary"
            onclick="logout()"
          >
            Logout
          </button>

        </header>

        <div class="admin-layout">

          <aside class="admin-nav">

            <button
              id="navCollections"
              onclick="adminSection('collections')"
            >
              📁 Collections
            </button>

            <button
              id="navPrompts"
              onclick="adminSection('prompts')"
            >
              ✦ Prompts
            </button>

            <button
              id="navSettings"
              onclick="adminSection('settings')"
            >
              ⚙ Settings
            </button>

          </aside>

          <section
            class="admin-content"
            id="adminContent"
          ></section>

        </div>

      </main>

    </div>

    <div id="modalArea"></div>
  `;

  adminSection("collections");
}

function adminSection(section){

  document.querySelectorAll(".admin-nav button")
    .forEach(x=>x.classList.remove("active"));

  if(section==="collections")
    document.getElementById("navCollections")
      ?.classList.add("active");

  if(section==="prompts")
    document.getElementById("navPrompts")
      ?.classList.add("active");

  if(section==="settings")
    document.getElementById("navSettings")
      ?.classList.add("active");

  if(section==="collections")
    renderAdminCollections();

  if(section==="prompts")
    renderAdminPrompts();

  if(section==="settings")
    renderAdminSettings();
}

/* ==============================
   COLLECTION CMS
============================== */

function renderAdminCollections(){

  const box =
    document.getElementById("adminContent");

  box.innerHTML = `

    <section class="admin-box">

      <div class="admin-row"
           style="border:0;padding-top:0">

        <div>
          <h2>Collections</h2>
          <div class="status">
            Create and manage your prompt categories.
          </div>
        </div>

        <button
          onclick="showCollectionEditor()"
        >
          + Add Collection
        </button>

      </div>

      ${
        collections.length
        ?
        collections.map((c,i)=>`

          <div class="admin-row">

            <div class="admin-info">

              <strong>
                ${esc(c.title)}
              </strong>

              <small>
                ${esc(c.description || "No description")}
              </small>

            </div>

            <div class="admin-actions">

              <button
                class="secondary"
                onclick="moveCollection('${c.id}',-1)"
              >
                ↑
              </button>

              <button
                class="secondary"
                onclick="moveCollection('${c.id}',1)"
              >
                ↓
              </button>

              <button
                class="secondary"
                onclick="showCollectionEditor('${c.id}')"
              >
                Edit
              </button>

              <button
                class="danger"
                onclick="deleteCollection('${c.id}')"
              >
                Delete
              </button>

            </div>

          </div>

        `).join("")
        :
        `<div class="empty">No collections yet.</div>`
      }

    </section>
  `;
}

function showCollectionEditor(id=null){

  editingCollectionId = id;

  const c =
    id
    ? collections.find(x=>x.id===id)
    : null;

  document.getElementById("modalArea").innerHTML = `

    <div class="modal-bg show">

      <div class="modal">

        <h2>
          ${c ? "Edit Collection" : "Add Collection"}
        </h2>

        <div class="form-row">

          <label>Collection Title</label>

          <input
            id="collectionTitle"
            value="${c ? esc(c.title) : ""}"
            placeholder="e.g. AI Image Prompts"
          >

        </div>

        <div class="form-row">

          <label>Description</label>

          <textarea
            id="collectionDescription"
            placeholder="Collection description"
          >${c ? esc(c.description) : ""}</textarea>

        </div>

        <div class="modal-actions">

          <button onclick="saveCollection()">
            Save Collection
          </button>

          <button
            class="secondary"
            onclick="closeModal()"
          >
            Cancel
          </button>

        </div>

        <p id="modalError" class="status"></p>

      </div>

    </div>
  `;
}

async function saveCollection(){

  if(!isAdmin()){
    toast("Admin access required");
    return;
  }

  const title =
    document.getElementById("collectionTitle")
      .value.trim();

  const description =
    document.getElementById("collectionDescription")
      .value.trim();

  if(!title){
    document.getElementById("modalError")
      .textContent="Collection title is required.";
    return;
  }

  try{

    if(editingCollectionId){

      await db.collection("collections")
        .doc(editingCollectionId)
        .update({
          title,
          description,
          updatedAt:
            firebase.firestore.FieldValue.serverTimestamp()
        });

      toast("Collection updated");

    }else{

      const maxOrder =
        collections.length
        ? Math.max(...collections.map(orderValue))
        : 0;

      await db.collection("collections").add({

        title,
        description,
        order:maxOrder+1,
        published:true,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp(),

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()
      });

      toast("Collection created");
    }

    closeModal();

  }catch(error){

    console.error(error);

    document.getElementById("modalError")
      .textContent =
      "Save failed: " + error.message;
  }
}

async function deleteCollection(id){

  if(!isAdmin()) return;

  const c =
    collections.find(x=>x.id===id);

  if(!confirm(
    `Delete "${c?.title || "this collection"}"?`
  )) return;

  try{

    const related =
      prompts.filter(
        p=>p.collectionId===id
      );

    const batch = db.batch();

    batch.delete(
      db.collection("collections").doc(id)
    );

    related.forEach(p=>{
      batch.delete(
        db.collection("prompts").doc(p.id)
      );
    });

    await batch.commit();

    toast("Collection deleted");

  }catch(error){

    alert("Delete failed: "+error.message);
  }
}

async function moveCollection(id,direction){

  if(!isAdmin()) return;

  const index =
    collections.findIndex(x=>x.id===id);

  const target=index+direction;

  if(index<0 || target<0 ||
     target>=collections.length) return;

  const a=collections[index];
  const b=collections[target];

  try{

    const batch=db.batch();

    batch.update(
      db.collection("collections").doc(a.id),
      {order:orderValue(b)}
    );

    batch.update(
      db.collection("collections").doc(b.id),
      {order:orderValue(a)}
    );

    await batch.commit();

  }catch(error){
    toast("Reorder failed");
  }
}

async function savePrompt(){

  if(!isAdmin()) return;

  const title =
    document.getElementById("promptTitle")
      .value.trim();

  const platform =
    document.getElementById("promptPlatform")
      .value.trim();

  const collectionId =
    document.getElementById("promptCollection")
      .value;

  const text =
    document.getElementById("promptText")
      .value.trim();

  if(!title || !platform || !collectionId || !text){

    document.getElementById("modalError")
      .textContent =
      "Title, platform, collection and prompt are required.";

    return;
  }

  try{

    if(editingPromptId){

      await db.collection("prompts")
        .doc(editingPromptId)
        .update({

          title,
          platform,
          collectionId,
          text,
          published:true,

          updatedAt:
            firebase.firestore.FieldValue.serverTimestamp()
        });

      toast("Prompt updated");

    }else{

      const sameCollection =
        prompts.filter(
          p=>p.collectionId===collectionId
        );

      const maxOrder =
        sameCollection.length
        ? Math.max(
            ...sameCollection.map(orderValue)
          )
        : 0;

      await db.collection("prompts").add({

        title,
        platform,
        collectionId,
        text,

        order:maxOrder+1,

        published:true,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp(),

        updatedAt:
          firebase.firestore.FieldValue.serverTimestamp()
      });

      toast("Prompt created");
    }

    closeModal();

  }catch(error){

    console.error(error);

    document.getElementById("modalError")
      .textContent =
      "Save failed: " + error.message;
  }
}

  if(!isAdmin()) return;

  const p=prompts.find(x=>x.id===id);

  if(!confirm(

    await db.collection("prompts")
      .doc(id)
      .delete();

    alert("Delete failed: "+error.message);

}

/* ==============================
   ROUTER
============================== */

function route(){

  const hash =
    location.hash.replace(/^#/,"");

  if(hash==="admin"){

    if(isAdmin())
      renderAdmin();
    else
      renderAdminLogin();

    return;
  }

  if(hash.startsWith("collection/")){

    const id =
      decodeURIComponent(
        hash.substring("collection/".length)
      );

    renderCollection(id);

    return;
  }

  renderHome();
}

window.addEventListener("hashchange",route);

auth.onAuthStateChanged(user=>{

  currentUser=user;

  route();

});

/* Initial */
route();
